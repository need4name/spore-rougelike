<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Primordia</title>
  <meta name="description" content="An evolution roguelike: guide one lineage from a single cell to the first spark of fire.">
  <meta name="theme-color" content="#0c1a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Primordia">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=21.6">
  <style>html, body { height: 100%; } body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>
  <div id="app"></div>
  <script src="js/data/parts.js?v=21.6"></script>
  <script src="js/data/world.js?v=21.6"></script>
  <script src="js/data/events.js?v=21.6"></script>
  <script src="js/game.js?v=21.6"></script>
  <script src="js/render.js?v=21.6"></script>
  <script src="js/ui.js?v=21.6"></script>
  <script>
    // Phones can keep old copies of some files after an update. If the files don't all come from
    // the same release, reload once; if that doesn't fix it, say so instead of running a broken mix.
    (function () {
      var want = '21.6'; var f = window.PRIMORDIA_FILES || {};
      var stale = ['parts', 'world', 'events', 'game', 'render', 'ui'].filter(function (n) { return f[n] !== want; });
      var key = 'primordiaReload';
      if (!stale.length) { try { sessionStorage.removeItem(key); } catch (e) {} return; }
      var tried = null; try { tried = sessionStorage.getItem(key); } catch (e) {}
      if (!tried) { try { sessionStorage.setItem(key, '1'); } catch (e) {} location.reload(); return; }
      var b = document.createElement('button');
      b.textContent = 'Part of the game did not update. Tap here to reload it.';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;padding:14px;border:0;border-radius:12px;background:#f2b544;color:#1a1200;font:700 16px system-ui,sans-serif';
      b.onclick = function () { try { sessionStorage.removeItem(key); } catch (e) {} location.reload(); };
      document.body.appendChild(b);
    })();
    // Keep a copy of the game on this device so it opens without internet (only on the hosted game).
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
